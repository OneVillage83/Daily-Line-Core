[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-line-core"
version = "0.0.0"
description = "Cross-sport decision aggregation and product assembly for The Daily Line"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
include = ["daily_line_core*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["daily_line_core"]
